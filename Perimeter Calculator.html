<html>
    <head>
        <title>Perimeter Calculator</title>
        <style>
            body{
                background: aliceblue;
                padding: 25px;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to Your Home Page</h1>
        <script>
                 var choice=prompt("Welcome to Perimeter Calculator.\n Please enter your choice.\n1.Perimeter of rectangle.\n2.Perimeter of Triangle.\n3.Perimeter of Circle.\n4.Perimeter of Pallelogram");
            if(choice == '1'){
                var l=prompt('Enter the Length')
                var b=prompt('Enter the Breadth')
                var result=Number(l)* Number(b)
                alert('The Perimeter is' + result)
            }
             if(choice == '2'){
                 var h=prompt('Enter the height')
                var b=prompt('Enter the base')
                var result=Number(h)* Number(b)/2
                alert('The Perimeter is' + result)
             }
              if(choice =='3'){
                var r=prompt('Enter the radius')
                var result= 3.14* Number(r)*Number(r)
                alert('The Perimeter is' + result)
              }
              if(choice == '4'){
                 var h=prompt('Enter the height')
                var cb=prompt('Enter the corresponding base')
                var result=Number(h)* Number(cb)
                alert('The Perimeter is' + result)
              }
        </script>
    </body>
</html>
